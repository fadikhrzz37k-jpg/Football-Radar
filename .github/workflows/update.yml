name: Mise à jour des actus

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Générer la page
        run: python update_news.py
      - name: Enregistrer les changements
        run: |
          git config user.name "hub-foot-bot"
          git config user.email "bot@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || (git commit -m "Mise à jour des actus" && git push)
